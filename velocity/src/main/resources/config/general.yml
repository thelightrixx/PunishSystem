  vize: ["punish.*"]

# --- Rang-Gewichte (Hierarchie-Schutz) ---
# Höherer Rang kann niedrigere bestrafen, nie umgekehrt. Gleichrangig erlaubt.
# Gewicht aus LuckPerms-Gruppengewicht, Fallback diese Liste. Konsole/Selbst wie bisher.
# Nach Änderungen: /punish-reload auf dem Proxy.
rang-gewicht:
  default: 0
  iron: 0
  gold: 0
  diamond: 0
  builder: 0
  builderplus: 0
  creator: 0
  developer: 0
  test-sup: 10
  supporter: 20
  community: 20
  moderator: 50
  manager: 50
  richter: 60
  admin: 80
  p-admin: 80
  vize: 90
  präsident: 100

# --- Blockierte Befehle beim Mute ---
# Diese Befehle werden vom gemuteten Spieler blockiert.
# Der Spieler kann keine privaten Nachrichten verschicken.
mute:
  blockierte-befehle: ["/msg", "/tell", "/w", "/whisper", "/t", "/r", "/reply", "/me", "/action", "/tellraw", "/say", "/teammsg", "/title", "/pm", "/dm", "/message", "/party", "/p", "/guild", "/g", "/plot", "/channel", "/ch", "/mail", "/nick", "/emsg", "/ereply", "/m"]

# --- Tab-Autocomplete für Bann-Gründe ---
# Vordefinierte Gründe, die beim Bann angezeigt werden können.
# Diese ersparen das Eingeben von Gründen jedes Mal.
tab:
  # Zeitangaben für Bannliste (z. B. in der /ban-Anzeige)
  dauer-liste: ["10m", "1h", "6h", "1d", "7d", "30d", "perm"]
  # Gründe für Bann-Einträge (TAB-Fallback, wenn ein Befehl unten keine eigene Liste hat)
  grund-liste: ["Beleidigung", "Spamming", "Cheating", "Teaming", "Bugusing", "Hacking"]

# --- Vorschläge pro Befehl + Vorlagen (nur Vorschläge, keine Regeln) ---
# Pro Befehl eigene TAB-Listen: /ban zeigt Ban-Gründe, /mute Mute-Gründe usw.
# Fehlt ein Befehl, gilt tab.* oben als Fallback.
# ban-ip/mute-ip/timeout-ip fallen ohne eigene Sektion auf ban/mute/timeout zurück.
# vorlagen: Grund -> empfohlene Dauer (GUI zeigt sie als "Empf. Dauer" an).
# Eigene Einträge einfach ergänzen oder anpassen:
vorschlaege:
  ban:
    gruende: ["Cheating", "Hacking", "Bugusing", "Teaming", "Ban-Umgehung", "Bedrohung"]
    dauern: ["1d", "7d", "14d", "30d"]
  mute:
    gruende: ["Spamming", "Beleidigung", "Werbung", "Provokation", "Streit"]
    dauern: ["10m", "30m", "1h", "6h", "1d"]
  timeout:
    gruende: ["Cool-down", "Streit", "Provokation", "Trolling"]
    dauern: ["10m", "30m", "1h", "6h"]
  freeze:
    gruende: ["Cheating-Verdacht", "Bugusing-Verdacht", "Regelverstoß", "Überprüfung"]
    dauern: ["10m", "30m", "1h", "6h", "perm"]
  kick:
    gruende: ["Störung", "AFK", "Provokation", "Regelverstoß"]
  warn:
    gruende: ["Spamming", "Beleidigung", "Werbung", "Störung", "Regelverstoß"]
  verstoss:
    gruende: ["Cheating", "Hacking", "Bugusing", "Teaming", "Beleidigung", "Spamming"]
  report:
    gruende: ["Cheating", "Beleidigung", "Spamming", "Provokation", "Bugusing", "Teaming"]
  vorlagen:
    - { befehl: ban, grund: Cheating, dauer: 30d }
    - { befehl: ban, grund: Ban-Umgehung, dauer: 30d }
    - { befehl: ban, grund: Bedrohung, dauer: 30d }
    - { befehl: ban, grund: Hacking, dauer: 30d }
    - { befehl: ban, grund: Bugusing, dauer: 14d }
    - { befehl: ban, grund: Teaming, dauer: 7d }
    - { befehl: mute, grund: Spamming, dauer: 1h }
    - { befehl: mute, grund: Beleidigung, dauer: 1d }
    - { befehl: mute, grund: Werbung, dauer: 6h }
    - { befehl: mute, grund: Provokation, dauer: 30m }
    - { befehl: mute, grund: Streit, dauer: 30m }
    - { befehl: timeout, grund: Cool-down, dauer: 30m }
    - { befehl: timeout, grund: Streit, dauer: 1h }
    - { befehl: timeout, grund: Provokation, dauer: 30m }
    - { befehl: timeout, grund: Trolling, dauer: 1h }
    - { befehl: freeze, grund: Cheating-Verdacht, dauer: 1h }
    - { befehl: freeze, grund: Bugusing-Verdacht, dauer: 1h }
    - { befehl: freeze, grund: Regelverstoß, dauer: 30m }
    - { befehl: freeze, grund: Überprüfung, dauer: 30m }

# --- Standard-Gründe für Strafen ---
# Diese Gründe werden automatisch verwendet, wenn kein Grund angegeben wird.
# Du kannst sie anpassen, um thematische Gründe zu verwenden.
defaults:
  ban-grund: "Regelverstoß"
  permabann-grund: "Schwerwiegender Regelverstoß"
  ban-ip-grund: "Umgehung / Evasion"
  timeout-grund: "Cool-down"
  freeze-grund: "Überprüfung"
  kick-grund: "Regelverstoß"
  verstoss-grund: "Regelverstoß"
  warn-grund: "Regelverstoß"
  # Vorlage für automatisch eskalierte Verstöße (%anzahl%, %stufe%, %grund%).
  # Beispiel-Ergebnis: "Automatische Eskalation bei 3 Verwarnungen (Stufe low, Auslöser: Spamming)"
  warn-eskalation-grund: "Automatische Eskalation bei %anzahl% Verwarnungen (Stufe %stufe%, Auslöser: %grund%)"
  mute-grund: "Regelverstoß"
  auto-bann-grund: "Automatischer Bann durch Verstoß-Limit"
  auto-bann-reset-grund: "Verstöße nach Auto-Bann-Ablauf zurückgesetzt"
