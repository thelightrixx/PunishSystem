# =========================================================
# PunishSystem - Spieler-Nachrichten (messages.yml, Velocity)
# Entwickelt von: lightrixx
# =========================================================
# Ordner: <Proxy-Datenordner>/config/
# Hier stehen alle Nachrichten für den Spieler selbst (Fehler, Erfolge, ...).
# Platzhalter: %spieler%, %dauer%, %grund%, %anzahl%, %max%, %min%, %ip%, %id%,
#   %text%, %ziel%, %filter%, %seite%, %seiten%, %typ%, %datum%, %ablauf%,
#   %ausfuehrer%, %bearbeiter%, %reporter%, %server%, %status%, %level%,
#   %punkte%, %stufe%, %wort%, %version%, %aktuell%, %channel%, %detail%,
#   %scope%, %bekannt%, %zuletzt%, %banstatus%, %rest%, %ipstatus%,
#   %banns%, %mutes%, %timeouts%, %plattform%, %warnungen%, %verbleibend%, %nummer%,
#   %befehl%, %nutzung%, %kandidaten%, %quelle%, %name%, %vorlage%
# Hinweis: %warn-grund% wird in broadcasts.yml (warn-eskalation) genutzt und ist
#   hier zur Vollständigkeit mit dokumentiert.
# MiniMessage-Format, Prefix wird automatisch vorangestellt.
# Nach Änderungen: Server neustarten oder /punish-reload nutzen.
# =========================================================

# --- Nachrichten für den Spieler selbst ---
# was der administrativ betroffene Spieler sieht
