name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: JDK 25 setzen
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Version, Handbuch und Werkzeuge prüfen
        run: |
          set -euo pipefail
          python scripts/check-standard.py
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/check-version.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/check-version.py
          fi
          python scripts/check-docs.py
          python -m unittest discover -s scripts -p test_project_tools.py
      - name: Alle Module bauen und testen
        run: |
          set -euo pipefail
          mvn -B -ntp clean verify 2>&1 | tee mvn.log
      - name: Windows-Werkzeuge prüfen
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\test-tools.ps1
      - name: JARs und SHA-256 prüfen
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/prepare-release.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/prepare-release.py
          fi
      - name: Geprüfte JARs sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jars-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.jar
            dist/*-sources.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
            dist/VERIFICATION.json
      - name: Fehlerprotokolle sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            mvn.log
            **/target/surefire-reports/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Geprüfte JARs laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jars-ubuntu-latest
          path: dist
      - name: Stabilen GitHub-Release erstellen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/*.jar
            dist/*-sources.zip
            dist/SHA256SUMS.txt
