name: Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: JDK 25 setzen
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Defekte Cache-Artefakte entfernen
        run: rm -rf "$HOME/.m2/repository/me/clip/placeholderapi"

      - name: Bauen (mit Tests)
        run: |
          set -euo pipefail
          mvn -B -ntp -pl velocity,bridge,bridge-1.21 -am clean package 2>&1 | tee mvn.log

      - name: Jars bereitstellen
        run: |
          set -euo pipefail
          V=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)
          echo "Version: ${V}"
          mkdir -p dist
          cp velocity/target/PunishSystem-[0-9]*-velocity.jar        "dist/PunishSystem-v${V}-velocity.jar"
          cp bridge/target/PunishSystem-[0-9]*-bridge.jar            "dist/PunishSystem-v${V}-bridge.jar"
          cp bridge-1.21/target/PunishSystem-[0-9]*-bridge-1.21.jar  "dist/PunishSystem-v${V}-bridge-1.21.jar"
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          ls -l dist

      - name: Jars als Artefakt sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: punishsystem-jars
          path: |
            dist/*.jar
            dist/SHA256SUMS.txt

      - name: Fehlerdetails ausgeben
        if: failure()
        run: |
          {
            echo '## Fehlerdiagnose'
            echo '### Arbeitsverzeichnis und pom'
            ls -la
            echo '### mvn.log (letzte 60 Zeilen)'
            tail -60 mvn.log 2>/dev/null || echo 'mvn.log fehlt'
            echo '### Fehlerzeilen (erste 60)'
            grep -a -E '\[ERROR\]|BUILD FAILURE' mvn.log 2>/dev/null | head -60 || echo 'keine [ERROR]-Zeilen'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Fehlerdiagnose::Details stehen in der Step-Summary dieses Runs (mvn-Log, ls, ERROR-Zeilen)."
          if [ -f mvn.log ]; then
            grep -a -E '\[ERROR\]' mvn.log | head -40 | while IFS= read -r zeile; do
              echo "::error title=Maven::${zeile}"
            done
            grep -a -E 'Compiling|BUILD' mvn.log | tail -10 | while IFS= read -r zeile; do
              echo "::error title=Kontext::${zeile}"
            done
          fi
          ls -la velocity/target bridge/target 2>&1 | tail -30 | while IFS= read -r zeile; do
            echo "::error title=target-Ordner::${zeile}"
          done

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Jars laden
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: punishsystem-jars
          path: dist

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.jar
            dist/SHA256SUMS.txt
